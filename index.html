<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOUNDER — a sperm whale odyssey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03253f; }
  #scene { position: fixed; inset: 0; display: block; }

  #ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    color: #dff3ff;
    text-align: center;
    transition: opacity 2.5s ease;
  }
  #ui.diving { opacity: 0; }

  .eyebrow {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(13px, 1.4vw, 19px);
    letter-spacing: 0.55em;
    text-indent: 0.55em; /* recenter letterspaced text */
    text-transform: uppercase;
    color: #a8d4ec;
    opacity: 0.85;
    margin-bottom: 1.2em;
    text-shadow: 0 0 18px rgba(20, 80, 130, 0.9);
  }

  .title-wrap { position: relative; }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    font-size: clamp(56px, 11vw, 168px);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    margin: 0;
    line-height: 1;
    color: #eef9ff;
    text-shadow:
      0 0 14px rgba(150, 220, 255, 0.55),
      0 0 60px rgba(60, 150, 220, 0.45),
      0 4px 30px rgba(0, 20, 40, 0.8);
    animation: titleGlow 6s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 14px rgba(150,220,255,.55), 0 0 60px rgba(60,150,220,.45), 0 4px 30px rgba(0,20,40,.8); }
    50%      { text-shadow: 0 0 22px rgba(170,230,255,.8),  0 0 90px rgba(80,170,235,.6),  0 4px 30px rgba(0,20,40,.8); }
  }

  /* echolocation rings pulsing out from behind the title */
  .ring {
    position: absolute; top: 50%; left: 50%;
    width: 1.2em; height: 1.2em;
    border: 1.5px solid rgba(160, 220, 255, 0.7);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: ping 5s cubic-bezier(0.1, 0.5, 0.3, 1) infinite;
    font-size: clamp(56px, 11vw, 168px);
  }
  .ring:nth-child(2) { animation-delay: 1.1s; }
  .ring:nth-child(3) { animation-delay: 2.2s; }
  @keyframes ping {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    8%   { opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(9);   opacity: 0; }
  }

  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: clamp(16px, 1.9vw, 26px);
    letter-spacing: 0.18em;
    color: #bfe2f5;
    margin-top: 2.2em;
    opacity: 0.9;
    text-shadow: 0 0 16px rgba(10, 60, 100, 0.9);
  }

  .start {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(14px, 1.5vw, 21px);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: #e8f6ff;
    margin-top: 4.5em;
    animation: breathe 3.2s ease-in-out infinite;
    pointer-events: auto;
    cursor: pointer;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .footnote {
    position: fixed; left: 22px; bottom: 16px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: rgba(170, 210, 235, 0.55);
  }

  /* deep-water vignette */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 40%, rgba(1, 12, 24, 0.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(1, 8, 18, 0.5) 100%);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="ui">
  <div class="eyebrow">A Sperm Whale Odyssey</div>
  <div class="title-wrap">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <h1>SOUNDER</h1>
  </div>
  <div class="tagline">see with sound&ensp;·&ensp;dive beyond light</div>
  <div class="start" id="start">Press Enter to Dive</div>
</div>
<div class="footnote">physeter macrocephalus — “big-headed blower” — respectfully declined both names</div>

<script type="importmap">
  { "imports": { "three": "./three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const FOG_COLOR = new THREE.Color(0x0a4d77);
const FOG_DENSITY = 0.026;

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = FOG_COLOR.clone();
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, -4, 0);

// ---------------------------------------------------------------- surface
// The ocean surface seen from below: displaced plane, brightest in a
// "Snell window" around the sun, shimmering with the wave normals.
const surfaceUniforms = {
  uTime: { value: 0 },
  uSunPos: { value: new THREE.Vector3(22, 0, -95) },
  uFogColor: { value: FOG_COLOR.clone().convertLinearToSRGB() },
  uFogDensity: { value: FOG_DENSITY },
  uBrightness: { value: 1.0 },
};

const surfaceMat = new THREE.ShaderMaterial({
  uniforms: surfaceUniforms,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    uniform float uTime;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vViewDist;

    float waveH(vec2 p, float t) {
      return sin(p.x * 0.085 + t * 0.9) * 0.55
           + sin(p.y * 0.110 + t * 0.7) * 0.45
           + sin((p.x + p.y) * 0.060 + t * 1.3) * 0.35
           + sin(p.x * 0.300 - t * 1.8) * 0.12;
    }

    void main() {
      vec3 pos = position;
      float h = waveH(pos.xz, uTime);
      pos.y += h;

      // analytic-ish normal from neighbors
      float e = 1.5;
      float hx = waveH(pos.xz + vec2(e, 0.0), uTime);
      float hz = waveH(pos.xz + vec2(0.0, e), uTime);
      vNormal = normalize(vec3(h - hx, e, h - hz));

      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorldPos = wp.xyz;
      vec4 mv = viewMatrix * wp;
      vViewDist = length(mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uSunPos;
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uBrightness;
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying float vViewDist;

    void main() {
      float sunDist = distance(vWorldPos.xz, uSunPos.xz);
      float glow = exp(-sunDist / 70.0);                  // Snell window
      float halo = exp(-sunDist / 220.0);                 // wide soft halo
      float shimmer = 0.5 + 0.6 * pow(abs(vNormal.x * 3.2 + vNormal.z * 2.4), 1.4);

      vec3 deep   = vec3(0.10, 0.36, 0.55);
      vec3 mid    = vec3(0.34, 0.70, 0.88);
      vec3 bright = vec3(1.25, 1.35, 1.32);

      vec3 col = mix(deep, mid, clamp(halo * shimmer, 0.0, 1.0));
      col = mix(col, bright, clamp(glow * 1.4 * shimmer, 0.0, 1.0));

      // canopy brightening: the surface right overhead catches downwelling light
      float near = exp(-vViewDist / 26.0);
      col += vec3(0.16, 0.30, 0.36) * near * shimmer;
      col *= uBrightness;

      float fogF = 1.0 - exp(-uFogDensity * vViewDist);
      col = mix(col, uFogColor, fogF);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

// ------------------------------------------------------------- water column
// A huge inward-facing sphere gives the open water its vertical light
// gradient: downwelling brightness above, abyss below.
const waterUniforms = { uBrightness: { value: 1.0 } };
{
  const mat = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uBrightness;
      varying vec3 vDir;
      void main() {
        float up = vDir.y * 0.5 + 0.5;
        vec3 down = vec3(0.005, 0.045, 0.09);
        vec3 mid  = vec3(0.039, 0.30, 0.47);   // matches the fog color
        vec3 top  = vec3(0.13, 0.46, 0.65);
        vec3 col = mix(down, mid, smoothstep(0.05, 0.5, up));
        col = mix(col, top, smoothstep(0.5, 0.95, up));
        gl_FragColor = vec4(col * uBrightness, 1.0);
      }
    `,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(520, 32, 24), mat);
  sky.renderOrder = -1;
  scene.add(sky);
}

const surfaceGeo = new THREE.PlaneGeometry(700, 700, 160, 160);
surfaceGeo.rotateX(Math.PI / 2); // normal faces down toward us
const surface = new THREE.Mesh(surfaceGeo, surfaceMat);
surface.position.y = 0;
scene.add(surface);

// ---------------------------------------------------------------- god rays
const rayUniformsList = [];
{
  const rayMat = (phase) => new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: { uIntensity: { value: 0.5 }, uPhase: { value: phase } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uIntensity;
      varying vec2 vUv;
      void main() {
        float edge = smoothstep(0.0, 0.5, vUv.x) * smoothstep(1.0, 0.5, vUv.x);
        float fall = pow(vUv.y, 1.8);  // bright at top, fading down
        vec3 col = vec3(0.55, 0.85, 1.0);
        gl_FragColor = vec4(col, edge * fall * uIntensity * 0.30);
      }
    `,
  });

  for (let i = 0; i < 16; i++) {
    const w = 6 + Math.random() * 14;
    const geo = new THREE.PlaneGeometry(w, 95);
    const mat = rayMat(Math.random() * Math.PI * 2);
    const ray = new THREE.Mesh(geo, mat);
    const dist = 30 + Math.random() * 75;
    ray.position.set(
      22 + (Math.random() - 0.5) * 110,   // fanned around the sun azimuth
      -36,
      -dist - 20
    );
    ray.rotation.y = (Math.random() - 0.5) * 0.6;     // keep faces toward camera
    ray.rotation.z = 0.10 + Math.random() * 0.14;     // consistent slant away from the sun
    rayUniformsList.push({ mat, speed: 0.25 + Math.random() * 0.5 });
    scene.add(ray);
  }
}

// ---------------------------------------------------------------- marine snow
let snow, snowVel;
{
  const N = 1600, RANGE = 70;
  const pos = new Float32Array(N * 3);
  snowVel = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * RANGE * 2;
    pos[i * 3 + 1] = -RANGE + Math.random() * RANGE;     // mostly below surface
    pos[i * 3 + 2] = (Math.random() - 0.5) * RANGE * 2;
    snowVel[i * 3]     = (Math.random() - 0.5) * 0.25;
    snowVel[i * 3 + 1] = -0.1 - Math.random() * 0.35;    // gentle sink
    snowVel[i * 3 + 2] = (Math.random() - 0.5) * 0.25;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(220,240,255,0.5)');
  g.addColorStop(1, 'rgba(200,230,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);

  const mat = new THREE.PointsMaterial({
    size: 0.42,
    map: new THREE.CanvasTexture(cv),
    transparent: true,
    opacity: 0.65,
    depthWrite: false,
    color: 0xbfe3ff,
  });
  snow = new THREE.Points(geo, mat);
  scene.add(snow);
}

// ---------------------------------------------------------------- whales
// Distant sperm-whale silhouettes. A lathe gives the blunt-headed body;
// flattened spheres give fluke and pectorals. Fog does the rest.
function makeWhale() {
  const profile = [
    [0.02, 0.0],  [0.18, 0.5],  [0.38, 1.4],  [0.70, 2.8],
    [1.05, 4.4],  [1.30, 6.0],  [1.42, 7.6],  [1.45, 9.0],
    [1.42, 10.4], [1.30, 11.4], [0.95, 12.1], [0.30, 12.45], [0.0, 12.5],
  ].map(([r, y]) => new THREE.Vector2(r, y));

  const mat = new THREE.MeshBasicMaterial({ color: 0x041f33 });
  const g = new THREE.Group();

  const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 24), mat);
  body.rotation.z = -Math.PI / 2;   // axis along +x, nose at +x
  g.add(body);

  const flukeGeo = new THREE.SphereGeometry(1, 12, 8);
  for (const s of [-1, 1]) {
    const fluke = new THREE.Mesh(flukeGeo, mat);
    fluke.scale.set(1.7, 0.14, 0.75);
    fluke.position.set(-0.4, 0, s * 1.15);
    fluke.rotation.y = s * -0.55;
    g.add(fluke);
  }
  for (const s of [-1, 1]) {
    const fin = new THREE.Mesh(flukeGeo, mat);
    fin.scale.set(0.9, 0.1, 0.45);
    fin.position.set(8.6, -0.9, s * 1.1);
    fin.rotation.z = -0.35;
    g.add(fin);
  }
  return g;
}

const whales = [];
const whaleDefs = [
  { scale: 1.6, y: -13, z: -55,  speed: 2.2, phase: 0.0, x: -38 },
  { scale: 1.1, y: -19, z: -78,  speed: 1.8, phase: 2.1, x: 42 },
  { scale: 0.55, y: -11.5, z: -58, speed: 2.2, phase: 0.7, x: -22 }, // calf shadowing the leader
];
for (const def of whaleDefs) {
  const w = makeWhale();
  w.scale.setScalar(def.scale);
  w.position.set(def.x, def.y, def.z);
  scene.add(w);
  whales.push({ obj: w, ...def });
}

// ---------------------------------------------------------------- light
scene.add(new THREE.AmbientLight(0x4488bb, 0.8));

// ---------------------------------------------------------------- dive state
const ui = document.getElementById('ui');
let diving = false, diveT = 0;
function startDive() {
  if (diving) return;
  diving = true;
  ui.classList.add('diving');
}
addEventListener('keydown', (e) => { if (e.key === 'Enter') startDive(); });
document.getElementById('start').addEventListener('click', startDive);
const diveParam = new URLSearchParams(location.search).get('dive');
if (diveParam !== null) setTimeout(startDive, 1500);
if (diveParam === 'deep') {  // jump mid-dive for visual testing
  startDive();
  diveT = 10;
  camera.rotation.x = -0.5;
  camera.position.y = -26;
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  surfaceUniforms.uTime.value = t;
  for (const r of rayUniformsList) {
    r.mat.uniforms.uIntensity.value = 0.45 + 0.55 * Math.sin(t * r.speed + r.mat.uniforms.uPhase.value) ** 2;
  }

  const pos = snow.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i) + snowVel[i * 3] * dt;
    let y = pos.getY(i) + snowVel[i * 3 + 1] * dt;
    let z = pos.getZ(i) + snowVel[i * 3 + 2] * dt;
    x += Math.sin(t * 0.4 + i) * 0.004;  // drift
    if (y < camera.position.y - 45) y += 70;
    if (y > 0) y -= 70;
    pos.setXYZ(i, x, y, z);
  }
  pos.needsUpdate = true;

  for (const w of whales) {
    w.obj.position.x += w.speed * dt;   // nose points +x; swim nose-first
    w.obj.position.y = w.y + Math.sin(t * 0.25 + w.phase) * 1.6;
    w.obj.rotation.z = Math.sin(t * 0.25 + w.phase + 1.2) * 0.05;
    if (w.obj.position.x > 110) w.obj.position.x = -110;
  }

  if (!diving) {
    camera.position.y = -4 + Math.sin(t * 0.5) * 0.18;
    camera.rotation.z = Math.sin(t * 0.23) * 0.012;
    camera.rotation.x = Math.sin(t * 0.31) * 0.01;
  } else {
    diveT += dt;
    const k = Math.min(diveT / 14, 1);
    camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, -0.55, dt * 0.25);
    camera.position.y -= dt * (0.4 + k * 2.2);
    const depth = Math.min(-camera.position.y / 60, 1);
    const c = FOG_COLOR.clone().multiplyScalar(Math.max(1 - depth, 0.06));
    scene.fog.color.copy(c);
    surfaceUniforms.uFogColor.value.copy(c).convertLinearToSRGB();
    scene.background.copy(c);
    scene.fog.density = FOG_DENSITY + depth * 0.02;
    surfaceUniforms.uBrightness.value = Math.max(1 - depth * 1.2, 0);
    waterUniforms.uBrightness.value = Math.max(1 - depth, 0.05);
    if (diveT > 5 && diveParam !== 'deep') location.replace('game.html');
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
